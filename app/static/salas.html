<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrediGol — Mis Salas</title>
  <style>
    :root {
      --green:       #00D45E;
      --green-dark:  #00993F;
      --gold:        #FFD700;
      --bg:          #080D18;
      --card:        #0D1426;
      --card-border: rgba(255,255,255,0.07);
      --text:        #ECF4FF;
      --muted:       #7A90B8;
      --error:       #FF4060;
      --serif:       Georgia, 'Times New Roman', serif;
      --mono:        'Courier New', Courier, monospace;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      font-family: var(--serif);
      color: var(--text);
    }

    /* Pitch grid overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg,  transparent, transparent 99px, rgba(0,212,94,0.03) 99px, rgba(0,212,94,0.03) 100px),
        repeating-linear-gradient(90deg, transparent, transparent 99px, rgba(0,212,94,0.02) 99px, rgba(0,212,94,0.02) 100px);
      pointer-events: none;
      z-index: 0;
    }

    /* Floodlight radials */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 45% at 3%  3%,  rgba(0,212,94,0.07)  0%, transparent 60%),
        radial-gradient(ellipse 55% 45% at 97% 3%,  rgba(255,215,0,0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== SITE HEADER ===== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(8,13,24,0.93);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      gap: 16px;
    }

    /* Brand */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .brand-ball {
      width: 28px;
      height: 28px;
      animation: spinBall 10s linear infinite;
      filter: drop-shadow(0 0 6px rgba(0,212,94,0.5));
    }

    @keyframes spinBall { to { transform: rotate(360deg); } }

    .brand-name {
      font-size: 20px;
      font-weight: bold;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .brand-name em { font-style: normal; color: var(--green); }

    /* User info + logout */
    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .user-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--muted);
      white-space: nowrap;
    }

    .user-label strong {
      color: var(--gold);
      font-weight: bold;
      letter-spacing: 2px;
    }

    .logout-btn {
      background: none;
      border: 1px solid rgba(255,64,96,0.3);
      color: rgba(255,64,96,0.65);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .logout-btn:hover {
      background: rgba(255,64,96,0.1);
      border-color: rgba(255,64,96,0.55);
      color: rgba(255,64,96,1);
    }

    /* ===== PAGE ===== */
    .page {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }

    /* Page title */
    .page-hd {
      margin-bottom: 32px;
      animation: fadeDown 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }

    .page-hd h2 {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: -0.5px;
    }

    .page-hd p {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ===== TOP GRID (Create + Join) ===== */
    .top-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 620px) {
      .top-grid { grid-template-columns: 1fr; }
      .header-inner { padding: 0 16px; }
      .user-label { display: none; }
      .page { padding: 28px 14px 56px; }
    }

    /* ===== SECTION CARD ===== */
    .s-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 3px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(0,212,94,0.05),
        0 16px 40px rgba(0,0,0,0.5);
    }

    .s-card:nth-child(1) { animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.05s both; }
    .s-card:nth-child(2) { animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.1s  both; }

    .s-stripe {
      height: 3px;
    }

    .s-stripe.green {
      background: linear-gradient(90deg, transparent, var(--green-dark), var(--green), transparent);
    }

    .s-stripe.gold {
      background: linear-gradient(90deg, transparent, rgba(255,215,0,0.5), var(--gold), rgba(255,215,0,0.5), transparent);
    }

    .s-body { padding: 28px 28px 32px; }

    /* Section heading */
    .s-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .s-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .s-icon.green { background: rgba(0,212,94,0.12); }
    .s-icon.gold  { background: rgba(255,215,0,0.1);  }

    .s-title {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    /* ===== FORM FIELDS ===== */
    .field { margin-bottom: 22px; }

    .field label {
      display: block;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .field input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 2px solid rgba(255,255,255,0.1);
      padding: 10px 2px;
      font-family: var(--serif);
      font-size: 17px;
      color: var(--text);
      outline: none;
      caret-color: var(--green);
      transition: border-color 0.25s;
    }

    .field input::placeholder {
      color: rgba(236,244,255,0.1);
      font-style: italic;
      font-size: 15px;
    }

    .field input:focus        { border-bottom-color: var(--green); }
    .field input.gold-focus:focus { border-bottom-color: var(--gold); }

    .field input.code-input {
      font-family: var(--mono);
      font-size: 22px;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    /* ===== BUTTONS ===== */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn.green-btn { background: linear-gradient(135deg, var(--green), var(--green-dark)); color: #021a09; }
    .btn.gold-btn  { background: linear-gradient(135deg, var(--gold), #C9A227);            color: #1a1200; }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 55%);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .btn:hover           { transform: translateY(-2px); }
    .btn.green-btn:hover { box-shadow: 0 6px 20px rgba(0,212,94,0.35); }
    .btn.gold-btn:hover  { box-shadow: 0 6px 20px rgba(255,215,0,0.3);  }
    .btn:hover::before   { opacity: 1; }
    .btn:active          { transform: translateY(0); }
    .btn:disabled        { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    .btn.loading { color: transparent; }

    .btn.loading::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: rgba(0,0,0,0.8);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: loadSpin 0.55s linear infinite;
    }

    @keyframes loadSpin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    /* ===== FEEDBACK ===== */
    .feedback {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 2px;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.6;
    }

    .feedback.on { display: block; }

    .feedback.success {
      background: rgba(0,212,94,0.07);
      border: 1px solid rgba(0,212,94,0.22);
      border-left: 3px solid var(--green);
      color: var(--green);
      animation: fadeIn 0.3s ease both;
    }

    .feedback.error {
      background: rgba(255,64,96,0.07);
      border: 1px solid rgba(255,64,96,0.22);
      border-left: 3px solid var(--error);
      color: var(--error);
      animation: shake 0.4s cubic-bezier(0.36,0.07,0.19,0.97) both;
    }

    .code-chip {
      display: inline-block;
      font-family: var(--mono);
      font-size: 18px;
      letter-spacing: 5px;
      color: var(--gold);
      background: rgba(255,215,0,0.08);
      border: 1px solid rgba(255,215,0,0.2);
      padding: 4px 12px;
      margin-top: 8px;
    }

    .feedback-note {
      display: block;
      margin-top: 6px;
      font-size: 9px;
      letter-spacing: 1px;
      color: var(--muted);
      opacity: 0.7;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-5px); }
      40%     { transform: translateX(5px); }
      60%     { transform: translateX(-3px); }
      80%     { transform: translateX(3px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== MIS SALAS SECTION ===== */
    .salas-section {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 3px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(0,212,94,0.05),
        0 16px 40px rgba(0,0,0,0.5);
      animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.15s both;
    }

    .salas-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 28px 0;
    }

    .salas-hd .s-heading { margin-bottom: 0; }

    .sala-count-badge {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--card-border);
      padding: 3px 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* Empty state */
    .empty-state {
      display: none;
      padding: 52px 28px;
      text-align: center;
    }

    .empty-state.on { display: block; }

    .empty-icon {
      font-size: 40px;
      opacity: 0.18;
      margin-bottom: 14px;
    }

    .empty-state p {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--muted);
      opacity: 0.55;
      line-height: 1.8;
    }

    /* Sala list */
    .salas-list {
      display: none;
      padding: 12px 0 8px;
    }

    .salas-list.on { display: block; }

    .sala-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      border-bottom: 1px solid var(--card-border);
      transition: background 0.15s;
      animation: fadeIn 0.3s ease both;
      flex-wrap: wrap;
    }

    .sala-row:last-child { border-bottom: none; }
    .sala-row:hover      { background: rgba(255,255,255,0.02); }

    .sala-info { flex: 1; min-width: 0; }

    .sala-name {
      font-size: 17px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sala-chips {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      flex-wrap: wrap;
    }

    .chip-codigo {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 2.5px;
      color: var(--gold);
      background: rgba(255,215,0,0.07);
      border: 1px solid rgba(255,215,0,0.18);
      padding: 2px 8px;
    }

    .chip-id {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 1px;
      color: var(--muted);
    }

    /* "Ver partidos" link */
    .ver-btn {
      display: inline-block;
      background: rgba(0,212,94,0.08);
      border: 1px solid rgba(0,212,94,0.22);
      color: var(--green);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 2px;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .ver-btn:hover {
      background: rgba(0,212,94,0.16);
      border-color: rgba(0,212,94,0.45);
      box-shadow: 0 4px 12px rgba(0,212,94,0.18);
    }

    /* Inline ID entry for joined rooms (no known sala_id) */
    .id-entry {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .id-entry-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 1px;
      color: var(--muted);
      opacity: 0.7;
      white-space: nowrap;
    }

    .id-input {
      width: 58px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--card-border);
      border-radius: 2px;
      padding: 6px 8px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text);
      outline: none;
      text-align: center;
      caret-color: var(--gold);
      transition: border-color 0.2s;
    }

    .id-input:focus   { border-color: rgba(255,215,0,0.45); }
    .id-input.invalid { border-color: rgba(255,64,96,0.5); }
    .id-input::placeholder { color: rgba(255,255,255,0.15); font-size: 10px; }

    .save-id-btn {
      background: rgba(255,215,0,0.09);
      border: 1px solid rgba(255,215,0,0.22);
      color: var(--gold);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 7px 10px;
      border-radius: 2px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, border-color 0.2s;
    }

    .save-id-btn:hover {
      background: rgba(255,215,0,0.17);
      border-color: rgba(255,215,0,0.45);
    }

    /* ===== ENTRY KEYFRAMES ===== */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Sticky site header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand" aria-label="PrediGol — inicio">
        <svg class="brand-ball" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <radialGradient id="bG" cx="38%" cy="35%" r="65%">
              <stop offset="0%"   stop-color="#12291a"/>
              <stop offset="100%" stop-color="#060d0a"/>
            </radialGradient>
          </defs>
          <circle cx="50" cy="50" r="47" fill="url(#bG)" stroke="#00D45E" stroke-width="3"/>
          <polygon points="50,31 64,41 59,57 41,57 36,41" fill="#00D45E" stroke="#031409" stroke-width="2"/>
          <path d="M50,31 C50,22 50,12 50,4"  stroke="#00D45E" stroke-width="1.5" fill="none" opacity="0.5"/>
          <path d="M64,41 C72,36 80,30 88,24" stroke="#00D45E" stroke-width="1.5" fill="none" opacity="0.5"/>
          <path d="M59,57 C65,66 72,75 78,84" stroke="#00D45E" stroke-width="1.5" fill="none" opacity="0.5"/>
          <path d="M41,57 C35,66 28,75 22,84" stroke="#00D45E" stroke-width="1.5" fill="none" opacity="0.5"/>
          <path d="M36,41 C28,36 20,30 12,24" stroke="#00D45E" stroke-width="1.5" fill="none" opacity="0.5"/>
        </svg>
        <span class="brand-name">Predi<em>Gol</em></span>
      </a>

      <div class="header-right">
        <span class="user-label">Hola, <strong id="username">...</strong></span>
        <button class="logout-btn" onclick="logout()">Salir</button>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main class="page">

    <div class="page-hd">
      <h2>Mis Salas</h2>
      <p>Crea o únete a una sala para competir</p>
    </div>

    <!-- Top row: Create + Join -->
    <div class="top-grid">

      <!-- CREATE SALA -->
      <div class="s-card">
        <div class="s-stripe green"></div>
        <div class="s-body">
          <div class="s-heading">
            <div class="s-icon green">
              <!-- Plus icon -->
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M7 1v12M1 7h12" stroke="#00D45E" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
            <span class="s-title">Crear Sala</span>
          </div>

          <form id="createForm" onsubmit="doCreateSala(event)" novalidate>
            <div class="field">
              <label for="f-nombre">Nombre de la sala</label>
              <input id="f-nombre" type="text" placeholder="Ej: Los Campeones"
                     maxlength="60" autocomplete="off" required/>
            </div>
            <button class="btn green-btn" type="submit" id="b-create">Crear Sala</button>
            <div class="feedback" id="fb-create" role="alert" aria-live="assertive"></div>
          </form>
        </div>
      </div>

      <!-- JOIN SALA -->
      <div class="s-card">
        <div class="s-stripe gold"></div>
        <div class="s-body">
          <div class="s-heading">
            <div class="s-icon gold">
              <!-- Arrow-right icon -->
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M1 7h12M7.5 2L13 7l-5.5 5" stroke="#FFD700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <span class="s-title">Unirse a Sala</span>
          </div>

          <form id="joinForm" onsubmit="doJoinSala(event)" novalidate>
            <div class="field">
              <label for="f-codigo">Código de invitación</label>
              <input id="f-codigo" type="text" placeholder="AB3X9K"
                     maxlength="6" class="code-input gold-focus"
                     autocomplete="off" spellcheck="false" required/>
            </div>
            <button class="btn gold-btn" type="submit" id="b-join">Unirme</button>
            <div class="feedback" id="fb-join" role="alert" aria-live="assertive"></div>
          </form>
        </div>
      </div>

    </div><!-- /.top-grid -->

    <!-- MIS SALAS -->
    <section class="salas-section" aria-label="Mis salas">
      <div class="s-stripe green"></div>

      <div class="salas-hd">
        <div class="s-heading">
          <div class="s-icon green">
            <!-- List icon -->
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M1 3h12M1 7h12M1 11h8" stroke="#00D45E" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="s-title">Mis Salas</span>
        </div>
        <span class="sala-count-badge" id="sala-count">0 salas</span>
      </div>

      <!-- Empty state -->
      <div class="empty-state on" id="empty-state">
        <div class="empty-icon">⚽</div>
        <p>Aún no tienes salas.<br>Crea una o únete con un código.</p>
      </div>

      <!-- Populated list -->
      <div class="salas-list" id="salas-list"></div>

    </section>

  </main>

  <script>
    // ===== AUTH GUARD =====
    var token = localStorage.getItem('access_token');
    if (!token) {
      location.href = '/';
    }

    // Decode username from JWT payload — no library
    function decodeUsername(jwt) {
      try {
        var payload = JSON.parse(atob(jwt.split('.')[1]));
        return payload.sub || payload.nombre || payload.username || 'Usuario';
      } catch (_) {
        return 'Usuario';
      }
    }

    document.getElementById('username').textContent = decodeUsername(token);

    // ===== LOGOUT =====
    function logout() {
      localStorage.removeItem('access_token');
      localStorage.removeItem('salas_usuario');
      location.href = '/';
    }

    // ===== SALA STORAGE =====

    function getSalas() {
      try {
        return JSON.parse(localStorage.getItem('salas_usuario')) || [];
      } catch (_) {
        return [];
      }
    }

    function saveSalas(salas) {
      localStorage.setItem('salas_usuario', JSON.stringify(salas));
    }

    function addSala(sala) {
      var salas = getSalas();
      var isDuplicate = salas.some(function (s) {
        return (sala.sala_id && s.sala_id === sala.sala_id) ||
               (sala.codigo  && s.codigo  === sala.codigo);
      });
      if (!isDuplicate) {
        salas.unshift(sala);
        saveSalas(salas);
      }
    }

    function applySalaId(codigo, newId) {
      var salas = getSalas().map(function (s) {
        return s.codigo === codigo ? Object.assign({}, s, { sala_id: newId }) : s;
      });
      saveSalas(salas);
      renderSalas();
    }

    // ===== RENDER SALAS =====

    function renderSalas() {
      var salas  = getSalas();
      var list   = document.getElementById('salas-list');
      var empty  = document.getElementById('empty-state');
      var badge  = document.getElementById('sala-count');

      badge.textContent = salas.length + (salas.length === 1 ? ' sala' : ' salas');

      if (salas.length === 0) {
        empty.classList.add('on');
        list.classList.remove('on');
        list.innerHTML = '';
        return;
      }

      empty.classList.remove('on');
      list.classList.add('on');
      list.innerHTML = salas.map(buildSalaRow).join('');
    }

    function buildSalaRow(sala) {
      var codigoChip = sala.codigo
        ? '<span class="chip-codigo">' + esc(sala.codigo) + '</span>'
        : '';
      var idChip = sala.sala_id
        ? '<span class="chip-id">ID&nbsp;' + sala.sala_id + '</span>'
        : '';

      var actionHtml;
      if (sala.sala_id) {
        var href = '/static/partidos.html?sala_id=' + sala.sala_id +
                   '&sala_nombre=' + encodeURIComponent(sala.nombre || '');
        actionHtml = '<a class="ver-btn" href="' + href + '">Ver partidos &rarr;</a>';
      } else {
        // No sala_id known yet — offer inline ID entry
        var inputId = 'id-' + esc(sala.codigo);
        actionHtml = [
          '<div class="id-entry">',
          '  <span class="id-entry-label">ID:</span>',
          '  <input class="id-input" type="number" min="1" placeholder="123"',
          '         id="' + inputId + '" aria-label="ID de sala"/>',
          '  <button class="save-id-btn"',
          '          onclick="saveId(\'' + esc(sala.codigo) + '\',\'' + inputId + '\')">',
          '    Guardar',
          '  </button>',
          '</div>'
        ].join('');
      }

      return [
        '<div class="sala-row">',
        '  <div class="sala-info">',
        '    <div class="sala-name">' + esc(sala.nombre || 'Sala') + '</div>',
        '    <div class="sala-chips">' + codigoChip + idChip + '</div>',
        '  </div>',
        '  <div>' + actionHtml + '</div>',
        '</div>'
      ].join('');
    }

    function saveId(codigo, inputId) {
      var input = document.getElementById(inputId);
      var val   = parseInt(input ? input.value : '', 10);
      if (!val || val < 1) {
        if (input) {
          input.classList.add('invalid');
          setTimeout(function () { input.classList.remove('invalid'); }, 1200);
        }
        return;
      }
      applySalaId(codigo, val);
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ===== FEEDBACK HELPERS =====

    function showFeedback(id, type, html) {
      var el = document.getElementById(id);
      el.innerHTML  = html;
      el.className  = 'feedback';       // reset
      void el.offsetWidth;              // force reflow
      el.className  = 'feedback ' + type + ' on';
    }

    function setLoading(btnId, state) {
      var btn = document.getElementById(btnId);
      btn.disabled = state;
      btn.classList.toggle('loading', state);
    }

    // ===== CREATE SALA =====

    async function doCreateSala(event) {
      event.preventDefault();
      var nombre = document.getElementById('f-nombre').value.trim();
      if (!nombre) return;

      setLoading('b-create', true);

      try {
        var res  = await fetch('/salas?token=' + encodeURIComponent(token), {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ nombre: nombre })
        });
        var data = await res.json();

        if (res.ok) {
          addSala({ sala_id: data.sala_id, nombre: data.nombre, codigo: data.codigo });
          renderSalas();
          document.getElementById('f-nombre').value = '';
          showFeedback('fb-create', 'success',
            'Sala <strong>' + esc(data.nombre) + '</strong> creada.' +
            '<span class="code-chip">' + esc(data.codigo) + '</span>' +
            '<span class="feedback-note">Comparte este código con tus amigos</span>'
          );
        } else if (res.status === 401) {
          showFeedback('fb-create', 'error', 'Sesión expirada. Redirigiendo&hellip;');
          setTimeout(logout, 1800);
        } else {
          showFeedback('fb-create', 'error',
            esc(data.detail || 'No se pudo crear la sala. Inténtalo de nuevo.'));
        }
      } catch (_) {
        showFeedback('fb-create', 'error', 'No se pudo conectar con el servidor.');
      } finally {
        setLoading('b-create', false);
      }
    }

    // ===== JOIN SALA =====

    async function doJoinSala(event) {
      event.preventDefault();
      var rawCodigo = document.getElementById('f-codigo').value.trim();
      var codigo    = rawCodigo.toUpperCase();

      if (codigo.length !== 6) {
        showFeedback('fb-join', 'error', 'El código debe tener exactamente 6 caracteres.');
        return;
      }

      setLoading('b-join', true);

      try {
        var res  = await fetch('/salas/unirse?token=' + encodeURIComponent(token), {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ codigo: codigo })
        });
        var data = await res.json();

        if (res.ok) {
          var salaName = extractSalaName(data.mensaje) || codigo;
          addSala({ sala_id: null, nombre: salaName, codigo: codigo });
          renderSalas();
          document.getElementById('f-codigo').value = '';
          showFeedback('fb-join', 'success',
            esc(data.mensaje) +
            '<span class="feedback-note">Ingresa el ID de sala para ver los partidos</span>'
          );
        } else if (res.status === 401) {
          showFeedback('fb-join', 'error', 'Sesión expirada. Redirigiendo&hellip;');
          setTimeout(logout, 1800);
        } else if (res.status === 400) {
          var detail = (data.detail || '').toLowerCase();
          if (detail.includes('ya es miembro') || detail.includes('ya eres miembro')) {
            showFeedback('fb-join', 'error', 'Ya eres miembro de esta sala.');
          } else if (detail.includes('no encontrad')) {
            showFeedback('fb-join', 'error', 'Código de sala no encontrado.');
          } else {
            showFeedback('fb-join', 'error', esc(data.detail || 'No se pudo unir a la sala.'));
          }
        } else {
          showFeedback('fb-join', 'error', 'Ocurrió un error. Inténtalo de nuevo.');
        }
      } catch (_) {
        showFeedback('fb-join', 'error', 'No se pudo conectar con el servidor.');
      } finally {
        setLoading('b-join', false);
      }
    }

    // "Te uniste a la sala Mi Sala" → "Mi Sala"
    function extractSalaName(mensaje) {
      if (!mensaje) return null;
      var match = mensaje.match(/sala\s+(.+)$/i);
      return match ? match[1].trim() : null;
    }

    // Auto-uppercase code input
    document.getElementById('f-codigo').addEventListener('input', function () {
      var s = this.selectionStart;
      var e = this.selectionEnd;
      this.value = this.value.toUpperCase();
      this.setSelectionRange(s, e);
    });

    // ===== INIT =====
    renderSalas();
  </script>
</body>
</html>
