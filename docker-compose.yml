version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: password
      POSTGRES_DB: futbol_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d futbol_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app1:
    build: .
    environment:
      DATABASE_URL: postgresql://usuario:password@db:5432/futbol_db
      APP_INSTANCE: app1
    depends_on:
      db:
        condition: service_healthy

  app2:
    build: .
    environment:
      DATABASE_URL: postgresql://usuario:password@db:5432/futbol_db
      APP_INSTANCE: app2
    depends_on:
      db:
        condition: service_healthy

  app3:
    build: .
    environment:
      DATABASE_URL: postgresql://usuario:password@db:5432/futbol_db
      APP_INSTANCE: app3
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

volumes:
  postgres_data: